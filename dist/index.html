<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d32">
  <meta name="description" content="무명 신인에서 나만의 레전드까지. 훈련, 출전, 계약을 선택하는 야구 선수 커리어 게임.">
  <title>더그아웃 — 나의 야구 커리어</title>
  <link rel="icon" href="ball.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="league-data.js" defer></script>
  <script src="legacy-core.js" defer></script>
  <script src="legacy-v2-core.js" defer></script>
  <script src="schedule-data.js" defer></script>
  <script src="pathways-data.js" defer></script>
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">게임으로 바로가기</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="./" aria-label="더그아웃 홈"><img src="ball.svg" alt="" width="34" height="34"><span>DUGOUT<span class="brand-caption">YOUR BASEBALL STORY</span></span></a>
      <div class="nav-label">MY CAREER</div>
      <nav aria-label="주 메뉴">
        <button class="nav-item active" data-view="home"><span data-icon="home"></span>클럽하우스<span class="nav-dot"></span></button>
        <button class="nav-item" data-view="records"><span data-icon="chart"></span>나의 기록실</button>
        <button class="nav-item" data-view="development"><span data-icon="shield"></span>선수 관리</button>
        <button class="nav-item" data-view="life"><span data-icon="home"></span>라이프</button>
        <button class="nav-item" data-view="league"><span data-icon="trophy"></span>일정·순위</button>
        <button class="nav-item" data-view="timeline"><span data-icon="clock"></span>커리어 연표</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="season-note"><span class="tiny-kicker">EVERY LEGEND STARTS SOMEWHERE</span><div>위대한 기록도<br>첫 타석에서 시작되니까.</div><span class="baseball-stitch">⌁ ⌁ ⌁ ⌁ ⌁</span></div>
        <button class="nav-item" data-action="guide"><span data-icon="book"></span>플레이 가이드</button>
        <span class="version">고교부터 은퇴까지 · v0.3</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">DUGOUT <span>/</span> <strong id="breadcrumb">클럽하우스</strong></div><div class="header-actions"><span id="save-status" class="save-status"><i></i>기기 자동 저장</span><button class="icon-button" data-action="save-menu" aria-label="저장 및 게임 관리" title="저장 및 게임 관리"><span data-icon="settings"></span></button></div></header>
      <main id="main" tabindex="-1"><div class="boot-message">더그아웃을 준비하고 있습니다…<noscript>이 게임은 JavaScript를 켜야 실행할 수 있습니다.</noscript></div></main>
      <footer class="footer"><span>DUGOUT BASEBALL CLUB</span><span>당신의 선택이, 당신의 기록이 됩니다.</span></footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
